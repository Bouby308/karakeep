# Fork-only workflow: publishes the all-in-one Docker image to this
# repository owner's GitHub Container Registry namespace on every release.
# The upstream docker.yml pushes to the karakeep-app namespace and is not
# usable from forks.
name: Publish Docker (fork)

on:
  release:
    types:
      - created

concurrency:
  group: docker-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            os: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image namespace
        id: image
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}/karakeep" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.suffix }} image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile
          target: aio
          platforms: ${{ matrix.platform }}
          push: true
          build-args: SERVER_VERSION=${{ github.event.release.tag_name }}
          tags: ghcr.io/${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=aio-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=aio-${{ matrix.suffix }}

  manifest:
    name: Publish multi-architecture manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image namespace
        id: image
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}/karakeep" >> "$GITHUB_OUTPUT"

      - name: Create and publish release manifests
        env:
          BASE_IMAGE: ghcr.io/${{ steps.image.outputs.name }}
          VERSION_TAG: ${{ github.event.release.tag_name }}
        run: |
          docker buildx imagetools create \
            --tag "${BASE_IMAGE}:${VERSION_TAG}" \
            --tag "${BASE_IMAGE}:release" \
            --tag "${BASE_IMAGE}:latest" \
            "${BASE_IMAGE}:${VERSION_TAG}-amd64" \
            "${BASE_IMAGE}:${VERSION_TAG}-arm64"

      - name: Inspect published manifests
        env:
          BASE_IMAGE: ghcr.io/${{ steps.image.outputs.name }}
          VERSION_TAG: ${{ github.event.release.tag_name }}
        run: |
          docker buildx imagetools inspect "${BASE_IMAGE}:${VERSION_TAG}"
          docker buildx imagetools inspect "${BASE_IMAGE}:release"
          docker buildx imagetools inspect "${BASE_IMAGE}:latest"
